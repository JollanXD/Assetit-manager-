name: Build portable Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable folder
        run: pyinstaller --noconfirm --clean --windowed --name AssetIt --collect-all PySide6 --collect-all shiboken6 main.py

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AssetIt/Plugins | Out-Null
          Copy-Item Plugins/README.md dist/AssetIt/Plugins/README.md
          Copy-Item README.md dist/AssetIt/README.txt
          Compress-Archive -Path dist/AssetIt -DestinationPath dist/AssetIt-Portable-Windows-x64.zip -Force

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetIt-Portable-Windows-x64
          path: dist/AssetIt-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AssetIt-Portable-Windows-x64.zip
          generate_release_notes: true
