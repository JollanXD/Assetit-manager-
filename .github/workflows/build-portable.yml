name: Build portable Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python syntax
        run: python -m compileall -q main.py assets/make_icon.py

      - name: Generate application icon
        run: python assets/make_icon.py

      - name: Verify generated Windows icon
        run: python -c "from PIL import Image; im=Image.open('assets/assetit.ico'); print(im.format, im.size); assert im.format == 'ICO'"

      - name: Build portable folder
        run: pyinstaller --noconfirm --clean --windowed --onedir --name AssetIt --icon=assets/assetit.ico --collect-submodules PySide6.QtSvg --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets main.py

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AssetIt/Plugins | Out-Null
          Copy-Item Plugins/README.md dist/AssetIt/Plugins/README.md
          Copy-Item README.md dist/AssetIt/README.txt
          Compress-Archive -Path dist/AssetIt/* -DestinationPath dist/AssetIt-Portable-Windows-x64.zip -Force

      - name: Upload ready-to-extract portable folder
        uses: actions/upload-artifact@v4
        with:
          name: AssetIt-Portable-Windows-x64
          path: dist/AssetIt/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AssetIt-Portable-Windows-x64.zip
          generate_release_notes: true
